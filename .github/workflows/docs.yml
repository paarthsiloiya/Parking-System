name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main          # deploy on every push to main
    paths:
      - "docs/**"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:  # allow manual trigger from the Actions tab

# Grant the GITHUB_TOKEN the permissions needed to push to gh-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; cancel older queued runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # GUI libraries (customtkinter, Pillow, tkcalendar) are mocked via
          # autodoc_mock_imports in docs/conf.py and do NOT need to be installed.
          pip install -r docs/requirements.txt

      - name: Build HTML documentation
        run: sphinx-build -b html docs/ docs/_build/html --fail-on-warning -n

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
